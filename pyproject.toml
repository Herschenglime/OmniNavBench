[project]
name = "omninavbench"
version = "0.1.0"
description = "OmniNavBench: a unified general-purpose navigation benchmark across embodiments, styles, and sub-tasks."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "torch>=2.5.0",
    "numpy==1.26.*",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "gymnasium>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "flask>=3.0.0",
    "huggingface-hub>=0.23.0",
    "numpy-quaternion>=2023.0.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "toml>=0.10.0",
    "addict"
]

[tool.setuptools.package-data]
"bench.datasets" = ["metadata/*.json"]

[tool.black]
line-length = 120
skip-string-normalization = true
force-exclude = '''
lcmtypes
'''

[tool.isort]
profile = "black"
skip_glob = '**/lcmtypes/**'

[tool.setuptools]
packages = ['bench', 'OmniNav', 'OmniNavExt']
